[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsketch-backend"
version = "0.1.0"
description = "SmartSketch course knowledge graph API"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "markdown-it-py==4.2.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
