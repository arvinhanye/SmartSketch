openapi: 3.1.0

info:
  title: SmartSketch / 智绘学途 API
  version: 1.0.0
  description: |
    课程知识图谱智能构建与学习导航系统的前后端共享契约。

    命名基线为 ADR-008，不得引入同义别名。本文件是契约的单一真源（ADR-004）：
    实现代码、Cypher、Pydantic 模型与前端类型全部由它生成或以它为准，不得反向手改。

    两类状态不是 HTTP 错误，必须以 200 返回可机读状态（AGENTS.md 第 4 节、ADR-003）：
      - 问答证据不足 → `ChatResponse.status = not_covered`
      - 任务处理失败 → `Task.stage = failed`，附 `Task.error`

servers:
  - url: http://localhost:8000
    description: 本地开发

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录与角色
  - name: courses
    description: 课程管理与多课程隔离
  - name: documents
    description: 资料上传与解析
  - name: tasks
    description: 图谱生成任务与进度
  - name: graph
    description: 图谱读取与教师端修正
  - name: review
    description: 审核队列与发布
  - name: learning
    description: 学习进度、推荐与路径
  - name: chat
    description: 可信问答

paths:
  /health:
    get:
      tags: [auth]
      summary: 健康检查
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录，返回访问令牌与角色
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/courses:
    get:
      tags: [courses]
      summary: 当前用户可见的课程列表
      description: |
        仅返回调用者是成员的课程。课程内角色为 student 的课程只在曾经发布过
        （published_version 非空）后出现；每项 my_role 为调用者在该课的成员角色，
        与账号类型无关。见 `specs/identity-access.md` §4.4。
      operationId: listCourses
      responses:
        '200':
          description: 课程列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [courses]
      summary: 新建课程（教师）
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/courses/{cid}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [courses]
      summary: 课程详情
      operationId: getCourse
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 课程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 学生成员读取从未发布的课程（`GRAPH_NOT_PUBLISHED`）。课程不存在与非成员同为 403 `COURSE_FORBIDDEN`，见 `specs/identity-access.md` §4.1。

  /api/v1/courses/{cid}/members:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [courses]
      summary: 列出课程成员（教师成员）
      operationId: listMembers
      responses:
        '200':
          description: 课程成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [courses]
      summary: 按用户名添加学生成员（教师成员）
      description: |
        新成员的课程内角色固定为 student，返回 201；已是任意角色的成员时
        幂等返回原成员行和 200，不修改角色。用户名不存在或账号停用返回 404。
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdd'
      responses:
        '200':
          description: 已是成员，原角色不变
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMember'
        '201':
          description: 已添加学生成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/courses/{cid}/members/{uid}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    delete:
      tags: [courses]
      summary: 移除学生成员（教师成员）
      description: 只能移除学生成员；移除教师成员返回 403 `ROLE_FORBIDDEN`。
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 学生成员已移除
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/courses/{cid}/documents:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [documents]
      summary: 课程资料列表
      operationId: listDocuments
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 资料列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [documents]
      summary: 上传资料并创建图谱生成任务（教师）
      description: |
        仅接受 PDF、DOCX、TXT、Markdown。其他扩展名返回 `UNSUPPORTED_FORMAT`。
        上传成功立即返回任务 ID，处理过程通过 SSE 观察，见 `events.v1.md`。
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: >-
                  application/pdf,
                  application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                  text/plain, text/markdown
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '202':
          description: 已接受，任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFormat'

  /api/v1/courses/{cid}/upload-policy:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [documents]
      summary: 资料上传策略（教师）
      description: 当前部署的单文件上传上限（`UPLOAD_MAX_BYTES`），供前端本地校验与提示（ADR-022）。超过时 `uploadDocument` 仍返回 413。
      operationId: getUploadPolicy
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 上传策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/courses/{cid}/documents/{did}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    delete:
      tags: [documents]
      summary: 删除未产生图谱贡献的资料（教师）
      description: |
        只有该资料的全部任务都处于 `failed` 或 `cancelled` 时才可删除（ADR-021）：其贡献从未提交，
        删除资料、任务、解析修订与文本块及存储文件。有未结束任务或已有任务处理结束时返回 409。
      operationId: deleteDocument
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '204':
          description: 已删除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资料不存在，或不属于该课程（`NOT_FOUND`）。
        '409':
          description: |
            `DOCUMENT_NOT_DELETABLE`，`details: {stage, reason}`。`reason` 取值：`processing`（有未结束任务，
            `stage` 为其阶段）、`contributed`（有任务到达 `awaiting_review` 或 `completed`，`stage` 为其阶段）、
            `cleanup_pending`（有失败任务的图谱清理尚未完成，`stage = failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentNotDeletableError'

  /api/v1/tasks/{tid}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: 任务状态快照
      description: SSE 不可用时的轮询兜底，也是观察审核完成（`completed`）的方式。`stage = failed` 时 `error` 必填，HTTP 仍为 200。
      operationId: getTask
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 任务当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 是该课程成员但课程内角色不是教师（`ROLE_FORBIDDEN`）。
        '404':
          $ref: '#/components/responses/NotFound'
          description: 任务不存在，或调用者是任务所在课程的非成员（`NOT_FOUND`，二者不可区分，不含任务快照字段）。

  /api/v1/tasks/{tid}/event-ticket:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: 申领任务 SSE 的一次性票据（教师）
      description: |
        浏览器 `EventSource` 不能设置请求头，常规访问令牌不得放进 URL，因此订阅前先用 Bearer
        申领一次性票据。票据仅对本任务有效、只能核销一次、60 秒后过期；服务端只存其 sha256。
        见 `specs/identity-access.md` §5.1。
      operationId: issueEventTicket
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 已签发票据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTicket'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 是该课程成员但课程内角色不是教师（`ROLE_FORBIDDEN`）。
        '404':
          $ref: '#/components/responses/NotFound'
          description: 任务不存在，或调用者是任务所在课程的非成员（`NOT_FOUND`，二者不可区分，不含任务快照字段）。

  /api/v1/tasks/{tid}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: 订阅任务进度（SSE）
      description: |
        `text/event-stream`。只覆盖处理阶段：每个连接恰好以一条结束事件收尾（`stage = awaiting_review`
        的快照，或 `done` / `error` / `cancelled`）后关流。事件名、顺序保证、心跳与重连语义在
        `events.v1.md` §2、§4 中定义，本条目仅约束单条事件的数据结构。
        鉴权只用查询参数 `ticket`（`issueEventTicket` 签发），覆盖全局 Bearer，也不读取 `Authorization` 头；
        票据缺失、无效、过期、已用或与任务不符，或票据所属账号已停用 → 401 `UNAUTHENTICATED`。
      operationId: streamTaskEvents
      security:
        - eventTicket: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`issueEventTicket` 签发的一次性票据；不得传常规访问令牌（`specs/identity-access.md` §5.2）。'
          schema:
            type: string
            minLength: 22
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TaskEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 是该课程成员但课程内角色不是教师（`ROLE_FORBIDDEN`）。
        '404':
          $ref: '#/components/responses/NotFound'
          description: 任务不存在，或调用者是任务所在课程的非成员（`NOT_FOUND`，二者不可区分，不含任务快照字段）。

  /api/v1/tasks/{tid}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: 取消任务（教师）
      description: |
        协作式取消，所有受理结果都是 HTTP 200（`specs/task-processing.md` §4）：`queued` 直接转
        `cancelled`；`parsing` / `extracting` / `merging` 置 `cancel_requested = true`，到块边界后才转
        `cancelled`；重复取消幂等。`persisting` 不可中断，`awaiting_review` 与终态不可取消。
      operationId: cancelTask
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 请求已受理，以响应体 `stage` 与 `cancel_requested` 为准（`stage = cancelled` 为已取消；非终态且 `cancel_requested = true` 为取消中）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 是该课程成员但课程内角色不是教师（`ROLE_FORBIDDEN`）。
        '404':
          $ref: '#/components/responses/NotFound'
          description: 任务不存在，或调用者是任务所在课程的非成员（`NOT_FOUND`，二者不可区分，不含任务快照字段）。
        '409':
          description: |
            `TASK_NOT_CANCELLABLE`，`details: {stage, reason}`。`reason` 取值：
            `persisting_uninterruptible`（正在入库）、`processing_finished`（`awaiting_review`）、
            `already_terminal`（`completed` / `failed` / `cancelled`，`stage` 为实际终态）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNotCancellableError'

  /api/v1/courses/{cid}/graph:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [graph]
      summary: 读取课程图谱
      description: |
        教师读取草稿，学生只能读取已发布版本；学生请求未发布课程返回 `GRAPH_NOT_PUBLISHED`。
        响应即图谱交换格式（M0-04c），可直接用于前端 G6 适配层与导入导出。
      operationId: getGraph
      parameters:
        - name: chapter_id
          in: query
          description: 按章节过滤
          schema:
            type: string
        - name: type
          in: query
          description: 按知识点类型过滤
          schema:
            $ref: '#/components/schemas/KnowledgePointType'
        - name: relation_types
          in: query
          description: 按关系类型过滤
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RelationType'
        - name: version
          in: query
          description: 指定已发布版本号；省略时教师取草稿、学生取最新发布版
          schema:
            type: integer
            minimum: 1
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 图谱交换格式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExchange'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/courses/{cid}/kp:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [graph]
      summary: 知识点列表（卡片/列表视图）
      description: 支撑规格验收条件 5 的卡片视图，与图谱选中态联动。
      operationId: listKnowledgePoints
      parameters:
        - name: chapter_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/KnowledgePointType'
        - name: q
          in: query
          description: 按名称与别名搜索
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 知识点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePoint'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [graph]
      summary: 新增知识点（教师）
      description: 草稿写入须持课程写锁；超时返回 409 `COURSE_BUSY`。
      operationId: createKnowledgePoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePointCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '201':
          description: 已创建，`source` 固定为 manual、`locked` 固定为 true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/courses/{cid}/kp/{kid}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/KnowledgePointId'
    get:
      tags: [graph]
      summary: 知识点详情与出处
      description: 必须返回至少一条 `source_refs`（规格验收条件 5）。
      operationId: getKnowledgePoint
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 知识点详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePointDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [graph]
      summary: 修改知识点（教师）
      description: |
        请求必须携带节点级 `expected_revision`；与当前 `revision` 不一致时 409，
        不覆盖先前写入。修改成功后修订号递增，`locked` 置为 true，后续自动流程不再覆盖。
      operationId: updateKnowledgePoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePointUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [graph]
      summary: 删除知识点及其关系（教师）
      description: 草稿写入须持课程写锁；超时返回 409 `COURSE_BUSY`。
      operationId: deleteKnowledgePoint
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '204':
          description: 已删除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/courses/{cid}/kp/merge:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [graph]
      summary: 合并重复知识点（教师）
      description: 被合并节点的名称并入 `aliases`，关系与来源取并集后迁移到主节点。
      operationId: mergeKnowledgePoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 合并后的主节点
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/courses/{cid}/kp/{kid}/material:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/KnowledgePointId'
    post:
      tags: [learning]
      summary: 生成学习材料（讲解 + 示例 + 练习题）
      description: 对应规格验收条件 7。结果可缓存，教师审核后固定。
      operationId: generateStudyMaterial
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 学习材料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyMaterial'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/LlmUnavailable'

  /api/v1/courses/{cid}/relations:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [graph]
      summary: 新增关系（教师）
      description: |
        草稿写入须持课程写锁；超时返回 409 `COURSE_BUSY`。
        新增 `PREREQUISITE` 前执行 DAG 环检测；成环返回 `CYCLE_DETECTED`，
        并在 `details.cycle` 给出导致冲突的节点链路（规格验收条件 4）。
      operationId: createRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/courses/{cid}/relations/{rid}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/RelationId'
    patch:
      tags: [graph]
      summary: 修改关系类型或方向（教师）
      description: 草稿写入须持课程写锁；超时返回 409 `COURSE_BUSY`。改为或改动 `PREREQUISITE` 时同样执行环检测。
      operationId: updateRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [graph]
      summary: 删除关系（教师）
      description: 草稿写入须持课程写锁；超时返回 409 `COURSE_BUSY`。
      operationId: deleteRelation
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '204':
          description: 已删除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/courses/{cid}/review:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [review]
      summary: 审核队列（教师）
      description: 三栏：低置信度关系、疑似重复知识点、孤立知识点。每条附原文证据。
      operationId: getReviewQueue
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 审核队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/courses/{cid}/publish:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [review]
      summary: 发布图谱并生成快照（教师）
      description: 发布前返回图谱质量体检结果；存在环冲突时拒绝发布。
      operationId: publishGraph
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `PUBLISH_BLOCKED`（发布集合校验失败）返回结构化 `details.reasons`；
            `PUBLISH_IN_PROGRESS`、`COURSE_BUSY` 保持通用冲突响应。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PublishBlockedError'
                  - $ref: '#/components/schemas/PublishConflictError'

  /api/v1/courses/{cid}/versions:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [review]
      summary: 历史发布版本列表（教师）
      operationId: listVersions
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphVersion'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/courses/{cid}/versions/{version}/rollback:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [review]
      summary: 回滚到指定版本（教师）
      operationId: rollbackVersion
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 回滚后的版本信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/courses/{cid}/progress:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [learning]
      summary: 当前学生在本课程的掌握状态
      description: |
        请求开始时绑定一个已提交发布版 V（`specs/learning-path.md` §5），按 V 返回**每个节点**的进度项，
        而非只返回有原始行的节点；`status` 是与同版本推荐同一投影的有效状态（ADR-014 修订 1 决定 8）。
        响应的 `graph_version` 即绑定版本。只读当前发布版，无按历史版本查询的参数。
      operationId: getProgress
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 绑定版本 V 中每个节点的进度项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 学生成员读取从未发布的课程（`GRAPH_NOT_PUBLISHED`），不做进度投影。
        '500':
          description: |
            已提交版完整性故障（`specs/learning-path.md` §1、§4）：V=∅、重复 ID、环、悬空端点、章节树损坏、
            非法数值或绑定版本谱系违反不变式。只返回请求 ID（`details.request_id`，ADR-017 决定 4），
            不输出部分进度、内部节点 ID 或环路。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningIntegrityError'
    put:
      tags: [learning]
      summary: 批量更新掌握状态（学生）
      description: |
        请求体为非空 `ProgressUpdate[]`，身份只取自已认证学生，请求中不接受 `user_id`（`specs/learning-path.md` §5）。
        先对整批做鉴权、字段与 ID 校验：任一项非法、同批 `kp_id` 重复，或 `kp_id` 不在提交时绑定的发布版中
        （草稿独有、已删除、他课；发布指针变化后按新版本复核整批）时**整批拒绝、零写入**。
        最后一种返回 422 `VALIDATION_ERROR`，`details.fields[].reason = not_in_published_version` 并带 `details.graph_version`
        （ADR-017 决定 5）。
        合法批次在一个事务内全部写入。同值写入按 §5「同值写入」判定：仍有未被覆盖的继承来源时是一次显式写入，
        否则为无操作（不取写入序号、不改 `updated_at`）。
        成功后按最终绑定版本重新投影，返回该版本**每个节点**的进度项；发布指针途中变化且目标全部仍在时，
        `graph_version` 为新版本。
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 写入后按最终绑定版本 V 重新投影的每个节点的进度项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 学生成员写入从未发布的课程（`GRAPH_NOT_PUBLISHED`），零写入。
        '422':
          description: |
            `VALIDATION_ERROR`，整批零写入。两类情形：
            1. 请求体不满足 schema（空批次、缺字段、非法状态、带 `user_id` 等多余字段）或同批 `kp_id` 重复：
               按 B12 已定的通用 422 处理，`details.fields` 形状见 `errors.v1.md`。
            2. 目标 `kp_id` 不在请求事务所见的当前发布版中（ADR-017 决定 5）：草稿独有、已删除、他课三种情况
               同一 `reason = not_in_published_version`，不暴露他课节点是否存在；写入期间发布指针变化、复核时目标
               不在新版本中同样返回此错误。`details.fields` 每个不在发布版中的请求项一项
               `{in: "body", field: "<i>.kp_id", reason: "not_in_published_version"}`（`<i>` 为请求数组下标，与全局 422 的点路径一致），
               `details.graph_version` 为请求事务所见的当前发布版。客户端处置：重新 `GET /progress` 后再提交。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressValidationError'
        '500':
          description: |
            已提交版完整性故障（`specs/learning-path.md` §1、§4）：V=∅、重复 ID、环、悬空端点、章节树损坏、
            非法数值或绑定版本谱系违反不变式。只返回请求 ID（`details.request_id`，ADR-017 决定 4），
            不输出部分进度、内部节点 ID 或环路。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningIntegrityError'

  /api/v1/courses/{cid}/recommend:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [learning]
      summary: 下一步推荐
      description: |
        在请求开始绑定的单一已提交发布版上，对**全部**可学候选按 `specs/learning-path.md` §3 计算四项分量并按
        `(-score, chapter_rank, kp_id)` 稳定排序后截断为至多 `limit` 条；`total_eligible` 报告截断前的候选总数。
        理由由结构化事实生成，不调用 LLM。空态与错误按 §4 判定顺序区分：
        未发布为 404 `GRAPH_NOT_PUBLISHED`；已提交版损坏（含 V=∅）为 500 完整性错误；
        V 非空且全部掌握为 200 `state = all_mastered`；其余为 200 `state = recommendations`。不存在 `no_graph` 状态。
        目标导向完整路径属于 O01～O04 条件性加分项，本接口不提供（§7）。
      operationId: getRecommendations
      parameters:
        - name: limit
          in: query
          description: 返回条数上限，正整数，默认 10、最大 50；超出范围整请求拒绝（ADR-014 修订 1 决定 7）
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 推荐列表（`state = recommendations`），或 V 非空且全部掌握的空态（`state = all_mastered`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 学生成员请求从未发布的课程（`GRAPH_NOT_PUBLISHED`），不运行推荐函数；与 `all_mastered` 空态不同。
        '422':
          $ref: '#/components/responses/ValidationError'
          description: '`limit` 不是 1～50 的整数（`VALIDATION_ERROR`）。'
        '500':
          description: |
            已提交版完整性故障（`specs/learning-path.md` §1、§4）：V=∅、重复 ID、自环、环、悬空端点、章节树损坏、
            非法数值或绑定版本谱系违反不变式。只返回请求 ID（`details.request_id`，ADR-017 决定 4），
            不返回部分推荐、内部节点 ID 或环路。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningIntegrityError'

  /api/v1/courses/{cid}/chat:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [chat]
      summary: 可信问答（流式）
      description: |
        默认以 `text/event-stream` 流式返回，事件定义见 `events.v1.md`。
        `Accept: application/json` 时一次性返回完整 `ChatResponse`。

        证据不足时 **不是** HTTP 错误：返回 200，`status = not_covered`，
        `answer` 为可解释原因，`citations` 为空数组（ADR-003）。

        时序、终态矩阵与撤回规则以 `specs/grounded-qa.md` Q2、Q5、Q6 为准：开流前的失败是普通 HTTP 错误；
        开流后一切结局只通过事件表达。`meta` 与 `final` 都带绑定版本 `graph_version` 和 `request_id`；
        JSON 模式下 P2 之后发生的错误在 `details.request_id` 中带回请求 ID（Q7）。
      operationId: chat
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
            enum: [text/event-stream, application/json]
            default: text/event-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '200':
          description: 回答，或 `not_covered` 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 学生成员提问从未发布的课程（`GRAPH_NOT_PUBLISHED`）。
        '500':
          $ref: '#/components/responses/InternalError'
          description: JSON 模式下未预期的服务端异常（`INTERNAL_ERROR`，Q5 O13）；`details.request_id` 带回请求 ID。
        '503':
          description: |
            JSON 模式：主备模型或向量服务不可用（`LLM_UNAVAILABLE`，`details.reason` 同 Q5：upstream / stream_interrupted / timeout / auth），
            或存储不可用（`STORAGE_UNAVAILABLE`）。P2 之后发生时 `details.request_id` 带回请求 ID。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUnavailableError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        令牌载荷含 `sub`（用户 ID）与 `role`（teacher / student）。
        `role` 仅作前端路由提示；服务端不据此授权，课程内权限每次回查成员关系。
    eventTicket:
      type: apiKey
      in: query
      name: ticket
      description: 任务 SSE 使用的一次性票据；申领与核销规则见 `specs/identity-access.md` §5。

  parameters:
    CourseId:
      name: cid
      in: path
      required: true
      description: 课程 ID，所有查询的第一隔离条件
      schema:
        type: string
    DocumentId:
      name: did
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: tid
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: uid
      in: path
      required: true
      schema:
        type: string
    KnowledgePointId:
      name: kid
      in: path
      required: true
      schema:
        type: string
    RelationId:
      name: rid
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthenticated:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 角色不允许，或跨课程访问（`COURSE_FORBIDDEN`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在，或学生读取未发布图谱（`GRAPH_NOT_PUBLISHED`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突，如 `CYCLE_DETECTED`、`NODE_LOCKED`、`TASK_NOT_CANCELLABLE`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedFormat:
      description: 不支持的资料格式（`UNSUPPORTED_FORMAT`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileTooLarge:
      description: 文件超出上限（`FILE_TOO_LARGE`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 请求体校验失败（`VALIDATION_ERROR`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        请求受限：`RATE_LIMITED` 为限流，可按 `Retry-After` 重试；
        `BUDGET_EXCEEDED` 为预算耗尽，不重试，需等待额度恢复。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LlmUnavailable:
      description: 主备模型均不可用（`LLM_UNAVAILABLE`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 同步请求遇到未预期错误（`INTERNAL_ERROR`）；不含堆栈、密钥或原文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 面向用户的可读说明
        details:
          type: object
          description: 结构化补充，例如 `CYCLE_DETECTED` 的 `cycle` 节点链路
          additionalProperties: true

    ErrorCode:
      type: string
      description: 错误码全集，逐条说明见 `errors.v1.md`
      enum:
        - UNAUTHENTICATED
        - COURSE_FORBIDDEN
        - ROLE_FORBIDDEN
        - NOT_FOUND
        - GRAPH_NOT_PUBLISHED
        - UNSUPPORTED_FORMAT
        - FILE_TOO_LARGE
        - VALIDATION_ERROR
        - CYCLE_DETECTED
        - DANGLING_ENDPOINT
        - DUPLICATE_RELATION
        - NODE_LOCKED
        - TASK_NOT_CANCELLABLE
        - PUBLISH_BLOCKED
        - RATE_LIMITED
        - LLM_UNAVAILABLE
        - DOCUMENT_UNREADABLE
        - EXTRACTION_INCOMPLETE
        - STORAGE_UNAVAILABLE
        - INTERNAL_ERROR
        - TASK_ATTEMPTS_EXHAUSTED
        - PUBLISH_IN_PROGRESS
        - COURSE_BUSY
        - BUDGET_EXCEEDED
        - DOCUMENT_NOT_DELETABLE

    PublishBlockedReason:
      oneOf:
        - $ref: '#/components/schemas/PublishBlockedCycleReason'
        - $ref: '#/components/schemas/PublishBlockedOtherReason'

    PublishBlockedCycleReason:
      type: object
      description: ADR-012 V3 的前置关系环路，须给出环上的知识点 ID。
      required: [kind, cycle]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: cycle
        cycle:
          type: array
          minItems: 2
          x-closed-cycle: true
          description: 首尾为同一个知识点 ID。
          items:
            type: string
            minLength: 1

    PublishBlockedOtherReason:
      type: object
      description: ADR-012 V3 的其他发布校验原因；可附对象 ID 定位。
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [dangling_endpoint, invalid_source_ref, empty_graph, invalid_lineage]
        relation_id:
          type: string
          minLength: 1
        kp_id:
          type: string
          minLength: 1
        chunk_id:
          type: string
          minLength: 1

    PublishBlockedError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          const: PUBLISH_BLOCKED
        message:
          type: string
          minLength: 1
        details:
          $ref: '#/components/schemas/PublishBlockedDetails'

    PublishBlockedDetails:
      type: object
      required: [reasons]
      properties:
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublishBlockedReason'

    PublishConflictError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [PUBLISH_IN_PROGRESS, COURSE_BUSY]
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true

    Role:
      type: string
      enum: [teacher, student]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: 秒
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    CourseStatus:
      type: string
      description: draft 未发布；published 已发布；revising 已发布后再修改，学生仍见上一版
      enum: [draft, published, revising]

    Course:
      type: object
      required: [id, name, status, my_role, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/CourseStatus'
        my_role:
          $ref: '#/components/schemas/Role'
        teacher_id:
          type: string
        kp_count:
          type: integer
          minimum: 0
        published_version:
          type: [integer, 'null']
          description: 学生可见的版本号；从未发布为 null
        created_at:
          type: string
          format: date-time

    CourseCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000

    CourseMember:
      type: object
      required: [user_id, username, role, created_at]
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    MemberAdd:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          description: 目标学生的用户名，不填写调用者身份或成员角色。

    DocumentFormat:
      type: string
      enum: [pdf, docx, txt, markdown]

    Document:
      type: object
      required: [id, course_id, filename, format, parse_status, task_id, uploaded_at]
      properties:
        id:
          type: string
        course_id:
          type: string
        filename:
          type: string
        format:
          $ref: '#/components/schemas/DocumentFormat'
        size_bytes:
          type: integer
        parse_status:
          $ref: '#/components/schemas/TaskStage'
        task_id:
          type: [string, 'null']
          description: 该资料最新创建任务的 ID，与 `parse_status` 同源（D-16、ADR-021）；没有任务时为 null。可用于续订 SSE 与取消。
        uploaded_at:
          type: string
          format: date-time

    UploadPolicy:
      type: object
      required: [max_bytes]
      additionalProperties: false
      properties:
        max_bytes:
          type: integer
          minimum: 1
          description: 单文件上限（字节），与 413 `FILE_TOO_LARGE` 的 `details.limit_bytes` 同值。

    UploadAccepted:
      type: object
      required: [task_id, document_id]
      properties:
        task_id:
          type: string
        document_id:
          type: string

    TaskStage:
      type: string
      description: |
        主线 `queued → parsing → extracting → merging → persisting → awaiting_review → completed`（命名基线 ADR-008）。
        各阶段能否转 `failed` / `cancelled`、由谁触发、何时关流，只以 `specs/task-processing.md` §1、§2（ADR-010）为准，
        本契约不另写一份转换规则。终态为 completed、failed、cancelled；`awaiting_review` 是处理结束的非终态。
      enum:
        - queued
        - parsing
        - extracting
        - merging
        - persisting
        - awaiting_review
        - completed
        - failed
        - cancelled

    TaskCounts:
      type: object
      properties:
        chunks_done:
          type: integer
          minimum: 0
        chunks_total:
          type: integer
          minimum: 0
        kp_count:
          type: integer
          minimum: 0
        relation_count:
          type: integer
          minimum: 0
        chunks_failed:
          type: integer
          minimum: 0

    FailedChunk:
      type: object
      description: |
        抽取阶段最终失败的块（L2 尝试耗尽后仍失败，`specs/task-processing.md` §5）。
        与 SourceRef 相同，`page` 与 `section_path` 至少给出一个，供审核页跳到原文。
      required: [chunk_id, code]
      anyOf:
        - required: [page]
        - required: [section_path]
      properties:
        chunk_id:
          type: string
          minLength: 1
        page:
          type: integer
          minimum: 1
        section_path:
          type: string
          minLength: 1
        code:
          $ref: '#/components/schemas/ErrorCode'

    Task:
      description: |
        任务快照，按 `stage` 分为四个分支（与 `TaskEvent` 同构，生成的 Pydantic / TypeScript 类型据此收窄）：
        处理中或待审核 `TaskActive`、`TaskCompleted`、`TaskFailed`、`TaskCancelled`。
        `stage = failed` ⇔ `error` 非空（TASK-17）；`cancelled` ⇒ `cancel_requested = true`（I5）；
        固定进度见 `specs/task-processing.md` §1。`failed_chunks` 只在快照中返回，SSE 事件只带计数。
      oneOf:
        - $ref: '#/components/schemas/TaskActive'
        - $ref: '#/components/schemas/TaskCompleted'
        - $ref: '#/components/schemas/TaskFailed'
        - $ref: '#/components/schemas/TaskCancelled'
      discriminator:
        propertyName: stage
        mapping:
          queued: '#/components/schemas/TaskActive'
          parsing: '#/components/schemas/TaskActive'
          extracting: '#/components/schemas/TaskActive'
          merging: '#/components/schemas/TaskActive'
          persisting: '#/components/schemas/TaskActive'
          awaiting_review: '#/components/schemas/TaskActive'
          completed: '#/components/schemas/TaskCompleted'
          failed: '#/components/schemas/TaskFailed'
          cancelled: '#/components/schemas/TaskCancelled'

    TaskBase:
      type: object
      description: 任务快照的公共字段。不单独出现在 wire 上，按 `stage` 由 `Task` 的四个分支各自收窄。
      required: [id, course_id, document_id, stage, progress, cancel_requested, created_at, updated_at]
      properties:
        id:
          type: string
        course_id:
          type: string
        document_id:
          type: string
        stage:
          $ref: '#/components/schemas/TaskStage'
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 整体进度，0–1
        cancel_requested:
          type: boolean
          description: 已受理取消请求。处理中阶段为「取消中」的依据；`cancelled` 时恒为 true，失败任务可能保持 true（TASK-7）。
        counts:
          $ref: '#/components/schemas/TaskCounts'
        failed_chunks:
          type: array
          description: 最终失败的块及定位；无失败块时为空数组或缺省。
          items:
            $ref: '#/components/schemas/FailedChunk'
        timings_ms:
          type: object
          description: 各阶段耗时，键为 TaskStage 值，用于性能实测（M3-04）
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskActive:
      description: 处理中或待审核（`queued`～`awaiting_review`）。`error` 缺省或为 null；`queued`、`awaiting_review` 的进度固定。
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - $ref: '#/components/schemas/FixedStageProgress'
        - type: object
          properties:
            stage:
              type: string
              enum: [queued, parsing, extracting, merging, persisting, awaiting_review]
            error:
              type: 'null'

    TaskCompleted:
      description: 审核发布后的终态；`progress` 固定为 1，`error` 缺省或为 null。
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            stage:
              type: string
              const: completed
            progress:
              type: number
              const: 1
            error:
              type: 'null'

    TaskFailed:
      description: 失败终态；`error` 必填且不为 null（TASK-17）。取消中失败时 `cancel_requested` 保持 true（TASK-7）。
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          required: [error]
          properties:
            stage:
              type: string
              const: failed
            error:
              $ref: '#/components/schemas/Error'

    TaskCancelled:
      description: 取消终态；取消必然先置标志，`cancel_requested` 恒为 true（I5），`error` 缺省或为 null。
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            stage:
              type: string
              const: cancelled
            cancel_requested:
              type: boolean
              const: true
            error:
              type: 'null'

    FixedStageProgress:
      description: |
        `specs/task-processing.md` §1 的固定进度：`queued` 为 0，`awaiting_review` 为 0.95
        （`completed` 为 1，由对应分支的 `const` 表达）。只约束取值，代码生成器会忽略，
        运行时由 C08 状态迁移纯函数保证。
      allOf:
        - if:
            properties:
              stage:
                const: queued
            required: [stage]
          then:
            properties:
              progress:
                const: 0
        - if:
            properties:
              stage:
                const: awaiting_review
            required: [stage]
          then:
            properties:
              progress:
                const: 0.95

    DocumentNotDeletableError:
      description: 删除资料被拒（ADR-021）。`details.stage` 为阻塞任务的实际阶段，前端据此刷新资料状态（H02）。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              const: DOCUMENT_NOT_DELETABLE
            details:
              $ref: '#/components/schemas/DocumentNotDeletableDetails'

    DocumentNotDeletableDetails:
      type: object
      description: 阻塞删除的任务阶段与原因（ADR-021）。
      required: [stage, reason]
      additionalProperties: false
      properties:
        stage:
          $ref: '#/components/schemas/TaskStage'
        reason:
          type: string
          enum: [processing, contributed, cleanup_pending]

    TaskNotCancellableError:
      description: |
        取消被拒（`specs/task-processing.md` §4）。`details.stage` 为任务实际阶段，前端据此刷新界面（H02）；
        `details.reason` 与 `stage` 的组合是闭集。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              const: TASK_NOT_CANCELLABLE
            details:
              oneOf:
                - $ref: '#/components/schemas/TaskPersistingDetails'
                - $ref: '#/components/schemas/TaskProcessingFinishedDetails'
                - $ref: '#/components/schemas/TaskAlreadyTerminalDetails'

    TaskPersistingDetails:
      type: object
      description: 正在入库，不可中断。
      required: [stage, reason]
      properties:
        stage:
          type: string
          const: persisting
        reason:
          type: string
          const: persisting_uninterruptible

    TaskProcessingFinishedDetails:
      type: object
      description: 处理已结束（`awaiting_review`）。
      required: [stage, reason]
      properties:
        stage:
          type: string
          const: awaiting_review
        reason:
          type: string
          const: processing_finished

    TaskAlreadyTerminalDetails:
      type: object
      description: 已处于终态，`stage` 为实际终态。
      required: [stage, reason]
      properties:
        stage:
          type: string
          enum: [completed, failed, cancelled]
        reason:
          type: string
          const: already_terminal

    TaskStageEvent:
      type: object
      description: |
        `event: stage`。建连快照（非终态）、进入新阶段、阶段内进度变化、`cancel_requested` 由 false 变 true 时推送。
        `stage = awaiting_review`（`progress = 0.95`）是处理期连接的结束事件，推送后服务端关流。
      required: [task_id, stage, progress, cancel_requested]
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/FixedStageProgress'
      properties:
        task_id:
          type: string
          minLength: 1
        stage:
          type: string
          enum: [queued, parsing, extracting, merging, persisting, awaiting_review]
        progress:
          type: number
          minimum: 0
          maximum: 1
        cancel_requested:
          type: boolean
          description: |
            已收到取消请求但 worker 尚未到达块边界（协作式取消）。这是**标志位不是状态**：
            取消未生效前 `stage` 仍是当前阶段，前端据此显示「取消中」。
        counts:
          $ref: '#/components/schemas/TaskCounts'
        elapsed_ms:
          type: integer
          minimum: 0

    TaskDoneEvent:
      type: object
      description: |
        `event: done`。只会作为「任务已 `completed` 后才建立的连接」的首条快照出现，随后关流；
        处理期的连接以 `awaiting_review` 收尾，永远收不到它（`specs/task-processing.md` §7）。
      required: [task_id, stage, progress]
      additionalProperties: false
      properties:
        task_id:
          type: string
          minLength: 1
        stage:
          type: string
          const: completed
        progress:
          type: number
          const: 1
        cancel_requested:
          type: boolean
        counts:
          $ref: '#/components/schemas/TaskCounts'
        elapsed_ms:
          type: integer
          minimum: 0

    TaskErrorEvent:
      type: object
      description: '`event: error`。任务进入或已处于 `failed`；`error` 必填且不为 null。发送后关流。'
      required: [task_id, stage, progress, error]
      additionalProperties: false
      properties:
        task_id:
          type: string
          minLength: 1
        stage:
          type: string
          const: failed
        progress:
          type: number
          minimum: 0
          maximum: 1
        error:
          $ref: '#/components/schemas/Error'
        cancel_requested:
          type: boolean
          description: 取消标志已置、到检查点前失败时保持 true（TASK-7）。
        counts:
          $ref: '#/components/schemas/TaskCounts'
        elapsed_ms:
          type: integer
          minimum: 0

    TaskCancelledEvent:
      type: object
      description: '`event: cancelled`。任务进入或已处于 `cancelled`；取消必然先置标志，故 `cancel_requested` 恒为 true。发送后关流。'
      required: [task_id, stage, progress, cancel_requested]
      additionalProperties: false
      properties:
        task_id:
          type: string
          minLength: 1
        stage:
          type: string
          const: cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
        cancel_requested:
          type: boolean
          const: true
        counts:
          $ref: '#/components/schemas/TaskCounts'
        elapsed_ms:
          type: integer
          minimum: 0

    TaskEvent:
      description: |
        单条任务 SSE 事件的 data 载荷。**每种事件有独立 schema 且 required 非空**，`{}` 不合法；
        按 `stage` 判别，与 `event:` 行一一对应（stage / done / error / cancelled）。
        事件名、顺序、关流与重连语义见 `events.v1.md` §2、§4。
      oneOf:
        - $ref: '#/components/schemas/TaskStageEvent'
        - $ref: '#/components/schemas/TaskDoneEvent'
        - $ref: '#/components/schemas/TaskErrorEvent'
        - $ref: '#/components/schemas/TaskCancelledEvent'
      discriminator:
        propertyName: stage
        mapping:
          queued: '#/components/schemas/TaskStageEvent'
          parsing: '#/components/schemas/TaskStageEvent'
          extracting: '#/components/schemas/TaskStageEvent'
          merging: '#/components/schemas/TaskStageEvent'
          persisting: '#/components/schemas/TaskStageEvent'
          awaiting_review: '#/components/schemas/TaskStageEvent'
          completed: '#/components/schemas/TaskDoneEvent'
          failed: '#/components/schemas/TaskErrorEvent'
          cancelled: '#/components/schemas/TaskCancelledEvent'

    EventTicket:
      type: object
      description: 任务 SSE 的一次性票据（`specs/identity-access.md` §5.1）。
      required: [ticket, expires_in]
      properties:
        ticket:
          type: string
          minLength: 22
          pattern: '^[A-Za-z0-9_-]+$'
          description: 至少 128 位密码学随机数的 URL 安全编码；只能用于本任务的一次连接。
        expires_in:
          type: integer
          const: 60
          description: 有效期秒数，固定 60，不可配置到更长。

    KnowledgePointType:
      type: string
      description: 对应 S2 表 6.3 的五类知识点
      enum: [concept, theorem, formula, method, example]

    KnowledgePointStatus:
      type: string
      description: 审核状态；low_confidence 项进入审核队列
      enum: [draft, low_confidence, approved, rejected]

    NodeSource:
      type: string
      enum: [ai, manual]

    RelationType:
      type: string
      description: ADR-008 命名基线，四类教学关系，不得引入别名
      enum: [CONTAINS, PREREQUISITE, RELATED_TO, EXAMPLE_OF]

    SourceRef:
      type: object
      description: |
        证据链的最小单元。必须能把读者带回原文的具体位置：
        `page`（正整数）与 `section_path`（非空）**至少给出一个**（ADR-003）。
        该规则写成 anyOf 而不是只写在描述里——描述文字不构成 schema 约束，
        生成的客户端与结构校验不会因此拦住无法定位的来源。
      required: [chunk_id, document_id]
      anyOf:
        - required: [page]
        - required: [section_path]
      properties:
        chunk_id:
          type: string
          minLength: 1
        document_id:
          type: string
          minLength: 1
        section_path:
          type: string
          minLength: 1
          description: 章节路径，如「第3章 > 3.1 栈」。无页码的来源（MD/TXT）靠它定位
        page:
          type: integer
          minimum: 1
          description: 页码，从 1 起。无分页的来源不带此字段（不是 null）
        text:
          type: string
          minLength: 1
          description: 原文片段，供前端高亮

    Chapter:
      type: object
      required: [id, title, order]
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
          minimum: 0

    KnowledgePoint:
      type: object
      required:
        - id
        - course_id
        - name
        - type
        - definition
        - level
        - confidence
        - status
        - source
        - locked
        - revision
      properties:
        id:
          type: string
        course_id:
          type: string
        chapter_id:
          type: [string, 'null']
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        type:
          $ref: '#/components/schemas/KnowledgePointType'
        definition:
          type: string
        importance:
          type: number
          minimum: 0
          maximum: 1
        difficulty:
          type: number
          minimum: 0
          maximum: 1
        level:
          type: integer
          minimum: 0
          description: 前置关系图中的最长前置路径长度，用于层次布局与路径排序
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          $ref: '#/components/schemas/KnowledgePointStatus'
        source:
          $ref: '#/components/schemas/NodeSource'
        locked:
          type: boolean
          description: true 时不被后续自动抽取/融合流程覆盖
        revision:
          type: integer
          minimum: 1
          description: 节点级乐观并发修订号；不同于课程 draft_revision。
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'

    KnowledgePointDetail:
      allOf:
        - $ref: '#/components/schemas/KnowledgePoint'
        - type: object
          required: [source_refs]
          properties:
            source_refs:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SourceRef'
            prerequisites:
              type: array
              description: 直接前置知识点
              items:
                $ref: '#/components/schemas/KnowledgePointRef'
            successors:
              type: array
              description: 直接后继知识点
              items:
                $ref: '#/components/schemas/KnowledgePointRef'
            related:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgePointRef'

    KnowledgePointRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/KnowledgePointType'

    KnowledgePointCreate:
      type: object
      required: [name, type, definition]
      properties:
        name:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
        type:
          $ref: '#/components/schemas/KnowledgePointType'
        definition:
          type: string
        chapter_id:
          type: string
        importance:
          type: number
          minimum: 0
          maximum: 1
        difficulty:
          type: number
          minimum: 0
          maximum: 1

    KnowledgePointUpdate:
      description: 必带 expected_revision，且至少提供一个可修改字段。
      allOf:
        - type: object
          required: [expected_revision]
          additionalProperties: false
          properties:
            expected_revision:
              type: integer
              minimum: 1
            name:
              type: string
            aliases:
              type: array
              items:
                type: string
            type:
              $ref: '#/components/schemas/KnowledgePointType'
            definition:
              type: string
            importance:
              type: number
              minimum: 0
              maximum: 1
            difficulty:
              type: number
              minimum: 0
              maximum: 1
            status:
              $ref: '#/components/schemas/KnowledgePointStatus'
        - anyOf:
            - type: object
              required: [name]
              properties:
                name: {type: string}
            - type: object
              required: [aliases]
              properties:
                aliases:
                  type: array
                  items: {type: string}
            - type: object
              required: [type]
              properties:
                type:
                  $ref: '#/components/schemas/KnowledgePointType'
            - type: object
              required: [definition]
              properties:
                definition: {type: string}
            - type: object
              required: [importance]
              properties:
                importance: {type: number, minimum: 0, maximum: 1}
            - type: object
              required: [difficulty]
              properties:
                difficulty: {type: number, minimum: 0, maximum: 1}
            - type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/KnowledgePointStatus'

    MergeRequest:
      type: object
      required: [primary_id, merged_ids]
      properties:
        primary_id:
          type: string
          description: 保留的主节点；其名称成为主名
        merged_ids:
          type: array
          minItems: 1
          items:
            type: string

    Relation:
      oneOf:
        - $ref: '#/components/schemas/RelationStandard'
        - $ref: '#/components/schemas/RelationDowngraded'

    RelationStandard:
      type: object
      required: [id, course_id, type, from_id, to_id, confidence, status, source, source_refs]
      additionalProperties: false
      properties:
        id:
          type: string
        course_id:
          type: string
        type:
          $ref: '#/components/schemas/RelationType'
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          $ref: '#/components/schemas/KnowledgePointStatus'
        source:
          $ref: '#/components/schemas/NodeSource'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'

    RelationDowngraded:
      type: object
      required: [id, course_id, type, from_id, to_id, confidence, status, source, source_refs, downgraded_from_type, downgrade_cycle]
      additionalProperties: false
      properties:
        id:
          type: string
        course_id:
          type: string
        type:
          type: string
          const: RELATED_TO
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          const: low_confidence
        source:
          type: string
          const: ai
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        downgraded_from_type:
          type: string
          const: PREREQUISITE
          description: 仅自动成环降级时返回；原关系类型。
        downgrade_cycle:
          type: array
          minItems: 2
          x-closed-cycle: true
          description: 仅自动成环降级时返回；触发降级的知识点 ID 环路。
          items:
            type: string
            minLength: 1

    RelationCreate:
      type: object
      required: [type, from_id, to_id]
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1

    RelationUpdate:
      type: object
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/KnowledgePointStatus'

    GraphStats:
      type: object
      description: 图谱质量体检，供教师发布前判断可用性
      required: [node_count, edge_count]
      properties:
        node_count:
          type: integer
        edge_count:
          type: integer
        edges_by_type:
          type: object
          additionalProperties:
            type: integer
        isolated_count:
          type: integer
          description: 无任何关系的孤立知识点数
        low_confidence_count:
          type: integer
        max_level:
          type: integer
        chapter_coverage:
          type: number
          minimum: 0
          maximum: 1
          description: 含至少一个知识点的章节占比

    GraphExchange:
      type: object
      description: |
        图谱交换格式（M0-04c）。同时用于 API 响应、前端 G6 适配层输入与图谱导入导出。
        `nodes` 与 `edges` 已按 `course_id` 隔离，调用方不得跨课程合并。
      required: [format_version, course_id, graph_version, generated_at, nodes, edges]
      properties:
        format_version:
          type: string
          const: '1.0'
        course_id:
          type: string
        graph_version:
          type: [integer, 'null']
          description: 已发布版本号；草稿为 null
        generated_at:
          type: string
          format: date-time
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        stats:
          $ref: '#/components/schemas/GraphStats'

    ReviewQueue:
      type: object
      required: [low_confidence_relations, suspected_duplicates, isolated_nodes]
      properties:
        low_confidence_relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        suspected_duplicates:
          type: array
          items:
            type: object
            required: [candidates, similarity]
            properties:
              candidates:
                type: array
                minItems: 2
                items:
                  $ref: '#/components/schemas/KnowledgePointRef'
              similarity:
                type: number
                minimum: 0
                maximum: 1
        isolated_nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointRef'

    GraphVersion:
      oneOf:
        - $ref: '#/components/schemas/PublishedGraphVersion'
        - $ref: '#/components/schemas/RollbackGraphVersion'

    PublishedGraphVersion:
      type: object
      required: [version, published_at, kind]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        published_at:
          type: string
          format: date-time
        kind:
          type: string
          const: publish
        node_count:
          type: integer
        edge_count:
          type: integer
        note:
          type: [string, 'null']

    RollbackGraphVersion:
      type: object
      required: [version, published_at, kind, source_version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        published_at:
          type: string
          format: date-time
        kind:
          type: string
          const: rollback
        source_version:
          type: integer
          minimum: 1
          description: 被回滚到的历史版本号。
        node_count:
          type: integer
        edge_count:
          type: integer
        note:
          type: [string, 'null']

    PublishResult:
      type: object
      required: [version, published_at, unchanged, excluded]
      properties:
        version:
          type: integer
        published_at:
          type: string
          format: date-time
        unchanged:
          type: boolean
          description: 内容摘要与当前发布版本相同时为 true，不分配新版本号。
        excluded:
          $ref: '#/components/schemas/PublishExcluded'
        stats:
          $ref: '#/components/schemas/GraphStats'

    PublishExcluded:
      type: object
      required: [low_confidence_nodes, low_confidence_edges, cascaded_edges]
      properties:
        low_confidence_nodes:
          type: integer
          minimum: 0
        low_confidence_edges:
          type: integer
          minimum: 0
        cascaded_edges:
          type: integer
          minimum: 0

    MasteryStatus:
      type: string
      description: 掌握状态，序为 `unknown < learning < mastered`；无记录等于 `unknown`。不设 `skipped` 等第四种状态（`specs/learning-path.md` §2）。
      enum: [unknown, learning, mastered]

    ProgressUpdate:
      type: object
      description: 单项写入；身份只取自已认证学生，不接受 `user_id` 等多余字段。
      required: [kp_id, status]
      additionalProperties: false
      properties:
        kp_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/MasteryStatus'

    ProgressInheritedSource:
      type: object
      description: 归属到本节点、有原始行且未被显式写入覆盖的合并来源（ADR-014 修订 1 决定 8、9）。内部写入序号与提交序号不上 wire。
      required: [kp_id, status]
      additionalProperties: false
      properties:
        kp_id:
          type: string
          minLength: 1
          description: 来源知识点 ID（不在绑定版本 V 中）
        status:
          $ref: '#/components/schemas/MasteryStatus'

    ProgressEntry:
      type: object
      description: |
        绑定版本 V 中一个节点的进度项（`specs/learning-path.md` §5，ADR-014 修订 1 决定 8）。
        `status` 是有效状态，与同版本推荐使用同一投影，等于 `own_status`（`null` 按 `unknown`）与
        `inherited_from[].status` 中的最高者；`own_status` 与 `updated_at` 只描述该学生在此 `kp_id` 的自身原始行，
        无自身行时二者同为 `null`，不冒充继承来源的时间。`inherited_from[]` 只列未被覆盖的来源，
        按 `kp_id` 的 UTF-8 字节序排列、`kp_id` 不重复，不含自身记录。
      required: [kp_id, status, own_status, inherited_from, updated_at]
      additionalProperties: false
      allOf:
        - if:
            properties:
              own_status:
                const: null
            required: [own_status]
          then:
            properties:
              updated_at:
                const: null
        - if:
            properties:
              updated_at:
                const: null
            required: [updated_at]
          then:
            properties:
              own_status:
                const: null
        - if:
            properties:
              status:
                const: unknown
            required: [status]
          then:
            properties:
              own_status:
                enum: [unknown, null]
              inherited_from:
                items:
                  properties:
                    status:
                      const: unknown
        - if:
            properties:
              status:
                const: learning
            required: [status]
          then:
            properties:
              own_status:
                enum: [unknown, learning, null]
              inherited_from:
                items:
                  properties:
                    status:
                      enum: [unknown, learning]
            anyOf:
              - properties:
                  own_status:
                    const: learning
              - properties:
                  inherited_from:
                    contains:
                      properties:
                        status:
                          const: learning
        - if:
            properties:
              status:
                const: mastered
            required: [status]
          then:
            anyOf:
              - properties:
                  own_status:
                    const: mastered
              - properties:
                  inherited_from:
                    contains:
                      properties:
                        status:
                          const: mastered
      properties:
        kp_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/MasteryStatus'
        own_status:
          description: 该学生在此 `kp_id` 的原始状态；无自身行为 `null`
          oneOf:
            - $ref: '#/components/schemas/MasteryStatus'
            - type: 'null'
        inherited_from:
          type: array
          description: 未被覆盖的继承来源，按 `kp_id` 的 UTF-8 字节序排列；无则为空数组
          items:
            $ref: '#/components/schemas/ProgressInheritedSource'
        updated_at:
          type: [string, 'null']
          format: date-time
          description: 自身原始行的更新时间；无自身行为 `null`。同值写入判定为无操作时不变

    ProgressResponse:
      type: object
      description: |
        `GET /progress` 与成功的 `PUT /progress` 的响应：`graph_version` 是本请求绑定（`PUT` 为提交时最终绑定）的发布版本号，
        `entries` 列出该版本 V 中**每个节点**的进度项，每个 `kp_id` 恰好一项，包括无原始行的节点。
        V=∅ 是已提交版完整性故障（500），因此正常响应至少一项。
      required: [graph_version, entries]
      additionalProperties: false
      properties:
        graph_version:
          type: integer
          minimum: 1
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProgressEntry'

    RecommendFactors:
      type: object
      description: |
        四项原始分量（`specs/learning-path.md` §3），各在 [0,1]：解锁度 u、重要度 i、章节顺序 c、易学度 e。
        属性顺序即固定求和顺序 u→i→c→e。wire 上传未舍入的 double，只有前端展示时舍入。
      required: [unlock, importance, chapter_order, ease]
      additionalProperties: false
      properties:
        unlock:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 解锁度 u = unlock_count / 全部候选的最大 unlock_count；最大值为 0 时为 0
        importance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 重要度 i = 0.5 × importance + 0.5 × centrality（ADR-014 决定 1）
        chapter_order:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 章节顺序 c = 1 − r/(C−1)；C=1 且属于该章为 1；无章节为 0
        ease:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 易学度 e = 1 − difficulty；缺难度时 difficulty 取 0.5

    RecommendWeightedFactors:
      type: object
      description: |
        四个加权分量 w × x，权重来自启动时读取的 `RECOMMEND_WEIGHT_*`（ADR-014 修订 1 决定 6），校验后原样使用。
        属性顺序即固定求和顺序 u→i→c→e：`score` 逐位等于 `((unlock + importance) + chapter_order) + ease` 的 IEEE 754 double 结果。
        未舍入 double，只有前端展示时舍入。权重和允许 1 ± 1e-9，因此不设上限。
      required: [unlock, importance, chapter_order, ease]
      additionalProperties: false
      properties:
        unlock:
          type: number
          format: double
          minimum: 0
        importance:
          type: number
          format: double
          minimum: 0
        chapter_order:
          type: number
          format: double
          minimum: 0
        ease:
          type: number
          format: double
          minimum: 0

    RecommendReasonFacts:
      type: object
      description: |
        生成理由所用的结构化事实，与同条推荐的分量同源，不调用 LLM（`specs/learning-path.md` §4）。
        `primary_factor` 是加权贡献最大的分量，同贡献按 unlock → importance → chapter_order → ease。
        无章节时 `chapter_id`、`chapter_name`、`chapter_rank` 同为 `null`。
      required: [primary_factor, chapter_id, chapter_name, chapter_rank, importance, centrality, difficulty]
      additionalProperties: false
      allOf:
        - if:
            properties:
              chapter_id:
                const: null
            required: [chapter_id]
          then:
            properties:
              chapter_name:
                const: null
              chapter_rank:
                const: null
          else:
            properties:
              chapter_name:
                type: string
              chapter_rank:
                type: integer
      properties:
        primary_factor:
          type: string
          enum: [unlock, importance, chapter_order, ease]
        chapter_id:
          type: [string, 'null']
          minLength: 1
        chapter_name:
          type: [string, 'null']
        chapter_rank:
          type: [integer, 'null']
          minimum: 0
          description: 发布版章节树前序遍历秩 r（0 起）
        importance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 参与计算的重要度属性；缺失时为中性值 0.5
        centrality:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: (in_degree + out_degree) / (N−1)；N ≤ 1 时为 0
        difficulty:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 参与计算的难度；缺失时为中性值 0.5

    Recommendation:
      type: object
      description: 单条下一步推荐（`specs/learning-path.md` §1、§3、§4）；`graph_version` 与所在响应相同。
      required: [kp_id, name, graph_version, score, factors, weighted, unlock_count, reason, reason_facts]
      additionalProperties: false
      allOf:
        - if:
            properties:
              unlock_count:
                const: 0
            required: [unlock_count]
          then:
            properties:
              factors:
                properties:
                  unlock:
                    const: 0
        - if:
            properties:
              factors:
                properties:
                  unlock:
                    const: 0
                required: [unlock]
            required: [factors]
          then:
            properties:
              unlock_count:
                const: 0
      properties:
        kp_id:
          type: string
          minLength: 1
        name:
          type: string
        graph_version:
          type: integer
          minimum: 1
        score:
          type: number
          format: double
          minimum: 0
          description: |
            四个加权分量按 u→i→c→e 固定顺序依次求和的未舍入 double，与 wire 中 `weighted` 的求和结果逐位相等；
            排序与同分判定都用未舍入值，只有前端展示时舍入，不得用展示值重算。
        factors:
          $ref: '#/components/schemas/RecommendFactors'
        weighted:
          $ref: '#/components/schemas/RecommendWeightedFactors'
        unlock_count:
          type: integer
          minimum: 0
          description: 学完此点后立即变为可学的不同直接后继数（不计已掌握、还缺其他前置或多跳到达的点）
        reason:
          type: string
          minLength: 1
          description: 由 `reason_facts` 与分量生成的一句理由，例如「完成该点可立即解锁 2 个知识点（解锁度 1.0000）」
        reason_facts:
          $ref: '#/components/schemas/RecommendReasonFacts'
      example:
        kp_id: kp_12
        name: 栈
        graph_version: 3
        score: 0.725
        factors:
          unlock: 0.5
          importance: 1.0
          chapter_order: 1.0
          ease: 0.5
        weighted:
          unlock: 0.175
          importance: 0.25
          chapter_order: 0.2
          ease: 0.1
        unlock_count: 1
        reason: 该点重要度最高（重要度 1.0000，中心度 1.0000）
        reason_facts:
          primary_factor: importance
          chapter_id: ch_1
          chapter_name: 第一章 线性表
          chapter_rank: 0
          importance: 1.0
          centrality: 1.0
          difficulty: 0.5

    PathStep:
      type: object
      description: 目标导向路径步骤。属于 O01～O04 条件性加分项，O02 定稿前不被任何接口引用（`specs/learning-path.md` §7）。
      required: [step, kp_id, name]
      properties:
        step:
          type: integer
          minimum: 1
          description: 步骤编号，用于图谱上的路径高亮
        kp_id:
          type: string
        name:
          type: string
        reason:
          type: string

    LearningPath:
      type: object
      description: 目标导向完整路径。属于 O01～O04 条件性加分项，O02 定稿前不被任何接口引用（`specs/learning-path.md` §7）。
      required: [target_id, reachable, steps]
      properties:
        target_id:
          type: string
        reachable:
          type: boolean
        steps:
          type: array
          description: 已去除掌握项的拓扑有序路径；reachable = false 时为空数组
          items:
            $ref: '#/components/schemas/PathStep'
        unreachable_reason:
          type: [string, 'null']
          description: reachable = false 时必填，说明为何无法到达

    RecommendListResponse:
      type: object
      description: 有可学候选时的推荐列表；`total_eligible` 为截断前的全部候选数（≥ 列表长度）。
      required: [state, graph_version, total_eligible, recommendations]
      additionalProperties: false
      properties:
        state:
          type: string
          const: recommendations
        graph_version:
          type: integer
          minimum: 1
          description: 本请求绑定的发布版本号；图、进度投影、理由均按此版本计算
        total_eligible:
          type: integer
          minimum: 1
        recommendations:
          type: array
          minItems: 1
          maxItems: 50
          description: 按 `(-score, chapter_rank, kp_id)` 稳定排序后截断的至多 `limit` 条
          items:
            $ref: '#/components/schemas/Recommendation'

    RecommendAllMasteredResponse:
      type: object
      description: V 非空且全部掌握（M = V）时的正常空态；不是错误，也不同于未发布（404）或已提交空图（500）。
      required: [state, graph_version, total_eligible, recommendations]
      additionalProperties: false
      properties:
        state:
          type: string
          const: all_mastered
        graph_version:
          type: integer
          minimum: 1
        total_eligible:
          type: integer
          const: 0
        recommendations:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/Recommendation'

    RecommendResponse:
      description: |
        下一步推荐结果，按 `state` 判别，闭集只有 `recommendations` 与 `all_mastered`（`specs/learning-path.md` §4）。
        未发布走 404 `GRAPH_NOT_PUBLISHED`，已提交空图走 500 完整性错误，均不以 200 状态表达；不存在 `no_graph`。
      oneOf:
        - $ref: '#/components/schemas/RecommendListResponse'
        - $ref: '#/components/schemas/RecommendAllMasteredResponse'
      discriminator:
        propertyName: state
        mapping:
          recommendations: '#/components/schemas/RecommendListResponse'
          all_mastered: '#/components/schemas/RecommendAllMasteredResponse'

    LearningIntegrityError:
      description: |
        学习进度与推荐读路径遇到已提交版完整性故障（`specs/learning-path.md` §1、§4、§5）：V=∅、重复 ID、自环、环、
        悬空端点、章节树损坏、非法数值或绑定版本谱系违反不变式；也用于这些接口的其他未预期异常。
        公开错误码为既有 `INTERNAL_ERROR`，不新增专用码（ADR-017 决定 4）；`details` 是闭合对象，
        只含 `request_id`，具体节点 ID 与环路只进服务端日志。已提交空图属于本错误，不增加 `no_graph` 状态。
        读路径先把原始进度投影到当前发布版节点集（LP-12，脏行告警后忽略）再计算；若可学集合计算仍抛出
        `ProgressOutsideGraphError`，视为缺陷，同样按本错误返回。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
            details:
              $ref: '#/components/schemas/LearningIntegrityDetails'

    LearningIntegrityDetails:
      type: object
      description: |
        完整性错误的细节，闭合对象。`request_id` 是本请求的请求 ID，与服务端日志、告警对应；
        与问答错误的 `details.request_id` 同名同型，作为全平台日志关联编号（ADR-017 决定 4）。
      required: [request_id]
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1

    ProgressValidationError:
      description: |
        `PUT /progress` 的 422（`VALIDATION_ERROR`）。请求体 schema 校验失败与同批 `kp_id` 重复沿用通用
        `details.fields` 形状，不在此收窄；当 `details.fields` 含 `reason = not_in_published_version` 或 `details`
        带 `graph_version` 时，`details` 必须是 `ProgressNotInPublishedVersionDetails`（ADR-017 决定 5）。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: VALIDATION_ERROR
          if:
            required: [details]
            properties:
              details:
                anyOf:
                  - required: [graph_version]
                  - required: [fields]
                    properties:
                      fields:
                        type: array
                        contains:
                          type: object
                          required: [reason]
                          properties:
                            reason:
                              const: not_in_published_version
          then:
            properties:
              details:
                $ref: '#/components/schemas/ProgressNotInPublishedVersionDetails'

    ProgressNotInPublishedVersionDetails:
      type: object
      description: |
        `PUT /progress` 目标不在请求事务所见的当前发布版时的 422 细节，闭合对象（ADR-017 决定 5）。
        草稿独有、已删除、他课三种情况同一 `reason`；写入期间发布指针变化、目标不在新版本时同样使用。
        不回显 `kp_id` 的值，只以请求数组下标定位。
      required: [fields, graph_version]
      additionalProperties: false
      properties:
        fields:
          type: array
          minItems: 1
          description: 每个不在发布版中的请求项一项；不与其他 `reason` 混排。
          items:
            $ref: '#/components/schemas/ProgressNotInPublishedVersionField'
        graph_version:
          type: integer
          minimum: 1
          description: 请求事务所见的当前发布版本号（发布指针途中变化时为复核所用的新版本）

    ProgressNotInPublishedVersionField:
      type: object
      description: 单个不在当前发布版中的请求项，闭合对象；`field` 为 `<i>.kp_id`，`<i>` 为请求数组下标，与全局 422 处理器的点路径一致（ADR-017 勘误）。
      required: [in, field, reason]
      additionalProperties: false
      properties:
        in:
          type: string
          const: body
        field:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.kp_id$'
        reason:
          type: string
          const: not_in_published_version

    ChatTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    ChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
        history:
          type: array
          description: 多轮上下文，供问题改写补全指代
          items:
            $ref: '#/components/schemas/ChatTurn'
        kp_id:
          type: string
          description: 从知识点详情「问助教」进入时带入

    Citation:
      type: object
      description: |
        引用编号与原文定位；生成后经引用校验，无效编号被剔除。
        与 `SourceRef` 同样要求可定位：`page` 与 `section_path` 至少给出一个。
      required: [index, chunk_id, document_id, text]
      anyOf:
        - required: [page]
        - required: [section_path]
      properties:
        index:
          type: integer
          minimum: 1
          description: 回答正文中标注的编号
        chunk_id:
          type: string
          minLength: 1
        document_id:
          type: string
          minLength: 1
        section_path:
          type: string
          minLength: 1
        page:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1

    ChatStatus:
      type: string
      description: |
        问答的两种终态。结构差异由 `ChatAnswered` / `ChatNotCovered` 两个
        独立 schema 表达，不靠本枚举的描述文字约束（ADR-003）。
      enum: [answered, not_covered]

    NotCoveredReason:
      type: string
      description: |
        机读的拒答原因，闭集。前端按此分支给出不同引导文案，
        不解析 `answer` 的自然语言（AGENTS.md §4「可机读的资料未覆盖状态」）。
        前两者在检索阶段判定、不调用生成；后两者调用了生成（`specs/grounded-qa.md` Q4、Q5）。
      enum:
        - no_retrieval_hit          # 检索无命中
        - below_similarity_threshold # 命中但相似度低于阈值
        - insufficient_evidence     # 生成模型以哨兵声明已检索证据不足（ADR-015 决定 3）
        - all_citations_invalidated # 生成完成但引用校验后无一条有效

    ChatAnswered:
      type: object
      description: 有依据的回答。**至少一条引用**，每条引用必须可定位。
      required: [status, answer, citations, graph_version, request_id]
      properties:
        status:
          type: string
          const: answered
        answer:
          type: string
          minLength: 1
        citations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Citation'
        related_kp_ids:
          type: array
          description: 「涉及的知识点」标签，点击跳转图谱并高亮
          items:
            type: string
        latency_ms:
          type: integer
          minimum: 0
        graph_version:
          type: integer
          minimum: 1
          description: 本请求绑定的发布版本号（P2 读一次发布指针）；请求途中发布或回滚不影响本请求（Q9）
        request_id:
          type: string
          minLength: 1
          description: P2 生成的请求 ID（ULID），与日志、`model_calls` 及错误 `details.request_id` 对应

    ChatNotCovered:
      type: object
      description: |
        资料未覆盖。**引用必须为空数组**，并给出机读原因。
        这是 200 响应的领域状态，不是 HTTP 错误（ADR-003）。
      required: [status, answer, citations, reason, graph_version, request_id]
      properties:
        status:
          type: string
          const: not_covered
        answer:
          type: string
          minLength: 1
          description: 面向用户的可解释说明，不得包含无依据的结论性内容
        citations:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/Citation'
        reason:
          $ref: '#/components/schemas/NotCoveredReason'
        related_kp_ids:
          type: array
          items:
            type: string
        latency_ms:
          type: integer
          minimum: 0
        graph_version:
          type: integer
          minimum: 1
          description: 本请求绑定的发布版本号（P2 读一次发布指针）；请求途中发布或回滚不影响本请求（Q9）
        request_id:
          type: string
          minLength: 1
          description: P2 生成的请求 ID（ULID），与日志、`model_calls` 及错误 `details.request_id` 对应

    ChatResponse:
      description: |
        按 `status` 分支的问答响应。分支存在的原因见 `src/contracts/README.md` §5.4：
        「answered 至少一条引用」若只写在描述里，生成的客户端会把
        `{"status":"answered","answer":"结论","citations":[]}` 当成合格响应。
      oneOf:
        - $ref: '#/components/schemas/ChatAnswered'
        - $ref: '#/components/schemas/ChatNotCovered'
      discriminator:
        propertyName: status
        mapping:
          answered: '#/components/schemas/ChatAnswered'
          not_covered: '#/components/schemas/ChatNotCovered'

    ChatMetaEvent:
      type: object
      description: |
        检索完成、生成开始前的第一条事件，恒为一条（`specs/grounded-qa.md` Q2）。
        `status = not_covered` 当且仅当检索阶段判定拒答，此时 `retrieved = 0`，后续不再有 delta，直接发 done。
        `status = answered` 表示进入生成（允许引用集合 A 非空，`retrieved ≥ 1`），不是承诺：终态仍可能是 `not_covered` 或 `error`。
      required: [event, status, retrieved, graph_version, request_id]
      allOf:
        - if:
            properties:
              status:
                const: not_covered
            required: [status]
          then:
            properties:
              retrieved:
                const: 0
        - if:
            properties:
              status:
                const: answered
            required: [status]
          then:
            properties:
              retrieved:
                minimum: 1
      properties:
        event:
          type: string
          const: meta
        status:
          $ref: '#/components/schemas/ChatStatus'
        retrieved:
          type: integer
          minimum: 0
          description: 允许引用集合 A 的大小（进入生成上下文的编号文本块数），供前端显示「已检索 N 段」
        graph_version:
          type: integer
          minimum: 1
          description: 本请求绑定的发布版本号（P2 读一次发布指针）；请求途中发布或回滚不影响本请求（Q9）
        request_id:
          type: string
          minLength: 1
          description: P2 生成的请求 ID（ULID），与日志、`model_calls` 及错误 `details.request_id` 对应

    ChatDeltaEvent:
      type: object
      description: |
        正文增量。**delta 阶段的正文是临时态**：其中出现的引用编号可能在
        引用校验后被剔除，前端不得在此阶段渲染可点击引用（events.v1.md §3）。
      required: [event, delta]
      properties:
        event:
          type: string
          const: delta
        delta:
          type: string
          minLength: 1

    ChatDoneEvent:
      type: object
      description: |
        终态事件，恰好一条、恒为末条，**携带最终正文**（`specs/grounded-qa.md` Q4、Q6）。
        `final.status = answered` 时，`final.answer` 与已下发全部 delta 的逐字拼接完全相等（不变式 I1），
        前端以 `final.answer` 为准显示并让引用标记变为可点击；两者不一致时仍显示 `final.answer` 并上报异常。
        `final.status = not_covered` 时撤回已显示的临时正文，改为显示 `final.answer`（服务端固定模板）。
      required: [event, final]
      properties:
        event:
          type: string
          const: done
        final:
          $ref: '#/components/schemas/ChatResponse'

    ChatError:
      description: |
        问答开流后（P2 之后）的错误，按 `code` 分两支（`specs/grounded-qa.md` Q5 的 O7～O13），码为闭集：
        `LLM_UNAVAILABLE` 必带 `details.reason`；`BUDGET_EXCEEDED`、`STORAGE_UNAVAILABLE`、`INTERNAL_ERROR` 不带 `reason`。
        两支都必带 `details.request_id`。`message` 是固定用户文案，不含模型输出、堆栈、密钥或原文。
      oneOf:
        - $ref: '#/components/schemas/ChatLlmUnavailableError'
        - $ref: '#/components/schemas/ChatServiceError'
      discriminator:
        propertyName: code
        mapping:
          LLM_UNAVAILABLE: '#/components/schemas/ChatLlmUnavailableError'
          BUDGET_EXCEEDED: '#/components/schemas/ChatServiceError'
          STORAGE_UNAVAILABLE: '#/components/schemas/ChatServiceError'
          INTERNAL_ERROR: '#/components/schemas/ChatServiceError'

    ChatLlmUnavailableError:
      description: 模型不可用（O7～O10）；`details.reason` 区分上游故障、流中断、链路超时与鉴权失败。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              const: LLM_UNAVAILABLE
            details:
              $ref: '#/components/schemas/ChatLlmUnavailableDetails'

    ChatServiceError:
      description: 预算拒绝（O11）、调用记录预写失败（O12）或未预期异常（O13）；不带 `reason`。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, details]
          properties:
            code:
              type: string
              enum: [BUDGET_EXCEEDED, STORAGE_UNAVAILABLE, INTERNAL_ERROR]
            details:
              $ref: '#/components/schemas/ChatErrorDetails'

    ChatErrorDetails:
      type: object
      description: 开流后错误的公共细节，闭合对象；`reason` 只属于 `LLM_UNAVAILABLE`。
      required: [request_id]
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1

    ChatLlmUnavailableDetails:
      type: object
      description: 开流后 `LLM_UNAVAILABLE` 的细节，闭合对象。
      required: [request_id, reason]
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1
        reason:
          $ref: '#/components/schemas/ChatLlmUnavailableReason'

    ChatLlmUnavailableReason:
      type: string
      description: |
        问答 `LLM_UNAVAILABLE` 的原因闭集（Q5）：`timeout` 当且仅当链路时限到期；其余首字前失败（含两路首字超时）
        一律 `upstream`；出字后供应商流中断为 `stream_interrupted`；供应商鉴权失败为 `auth`。
      enum: [upstream, stream_interrupted, timeout, auth]

    ChatUnavailableError:
      description: |
        问答接口的 503（开流前的 P2/P4 失败，以及 JSON 模式下的 O7～O10、O12，Q2、Q7）。
        `details` 为闭合对象：`request_id` 在 P2 之后出现；`reason` 只属于 `LLM_UNAVAILABLE` 且取 Q5 闭集。
        P4 向量调用失败的 `reason` 规格未定，因此 `reason` 可缺省。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [LLM_UNAVAILABLE, STORAGE_UNAVAILABLE]
            details:
              $ref: '#/components/schemas/ChatUnavailableDetails'
          if:
            properties:
              code:
                const: STORAGE_UNAVAILABLE
            required: [code]
          then:
            properties:
              details:
                not:
                  required: [reason]

    ChatUnavailableDetails:
      type: object
      description: 问答 503 的细节，闭合对象；两项都可缺省（P2 之前没有 `request_id`，P4 向量失败的 `reason` 规格未定）。
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1
        reason:
          $ref: '#/components/schemas/ChatLlmUnavailableReason'

    ChatErrorEvent:
      type: object
      description: |
        生成中断的异常终止（Q5 的 O7～O13）。与 done 互斥、恰好一条、恒为末条，发送后关闭连接。
        客户端收到后清除已显示的临时正文（Q6）。
      required: [event, error]
      properties:
        event:
          type: string
          const: error
        error:
          $ref: '#/components/schemas/ChatError'

    ChatEvent:
      description: |
        单条问答 SSE 事件的 data 载荷。**每种事件有独立 schema 且 required 非空**：
        原先的宽松对象允许 `{}` 通过校验，且文档里的 `answer` 字段在 schema 中并不存在
        （codex 审查 R04）。事件名、顺序与终止语义见 `events.v1.md` §3。
      oneOf:
        - $ref: '#/components/schemas/ChatMetaEvent'
        - $ref: '#/components/schemas/ChatDeltaEvent'
        - $ref: '#/components/schemas/ChatDoneEvent'
        - $ref: '#/components/schemas/ChatErrorEvent'
      discriminator:
        propertyName: event
        mapping:
          meta: '#/components/schemas/ChatMetaEvent'
          delta: '#/components/schemas/ChatDeltaEvent'
          done: '#/components/schemas/ChatDoneEvent'
          error: '#/components/schemas/ChatErrorEvent'

    StudyMaterial:
      type: object
      required: [kp_id, explanation, exercises]
      properties:
        kp_id:
          type: string
        explanation:
          type: string
          description: 通俗讲解
        examples:
          type: array
          items:
            type: string
        exercises:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/Exercise'
        cached:
          type: boolean
        reviewed:
          type: boolean
          description: 教师是否已审核固定
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'

    Exercise:
      type: object
      required: [question, answer, explanation]
      properties:
        question:
          type: string
        answer:
          type: string
        explanation:
          type: string
