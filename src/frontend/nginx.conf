# K08：前端容器的 nginx 站点配置。监听 8080（非 root 镜像不能绑 80）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 上传上限：后端 UPLOAD_MAX_BYTES 缺省 50 MiB，外加 multipart 表单开销（16 KiB）。
    # 代理必须比它略宽，让后端自己拒绝并返回契约里的 FILE_TOO_LARGE JSON；调大 UPLOAD_MAX_BYTES 时同步调大此值。
    client_max_body_size 51m;

    # 连后端都不必看的超大请求：仍按契约形状返回，不暴露 nginx 的英文 HTML 页面。
    error_page 413 = @file_too_large;
    location @file_too_large {
        default_type application/json;
        return 413 '{"code":"FILE_TOO_LARGE","message":"文件超过上传上限，请压缩或拆分后重试","details":{"limit_bytes":52428800}}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 任务进度走 SSE：关闭缓冲，并放宽读超时，避免长连接被代理截断。
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # 单页应用：未命中的路径回落到 index.html，由 vue-router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
