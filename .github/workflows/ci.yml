name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked contract tools
        run: |
          python -m pip install 'pyyaml==6.0.2' 'openapi-spec-validator==0.9.0' 'jsonschema==4.26.0' 'datamodel-code-generator==0.26.3' 'pytest==8.3.5'
          python -m pip check
          npm install --prefix "$RUNNER_TEMP/contract-tools" --no-save --ignore-scripts --no-audit --no-fund 'openapi-typescript@7.4.4'
          echo "$RUNNER_TEMP/contract-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check verification script syntax
        run: bash -n scripts/verify.sh scripts/gen-contracts.sh scripts/verify/contracts.sh
      - name: Verify repository scaffold
        run: ./scripts/verify.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund
      # K11：类型检查、vitest 全量（JUnit 报告判定：零测试、失败、未登记 skip 都判红）、构建
      - name: Frontend gate
        run: scripts/verify/frontend.sh full

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
      # K11：pytest tests/backend + tests/tooling，并判定报告（零测试、失败、未登记 SKIP 都判红）
      - name: Backend gate
        env:
          PYTHON: python
        run: scripts/verify/backend.sh full

  platform-windows:
    # 可移植性门禁：后端单测在 Windows 上跑一遍。
    # 存在的理由是两个只在 Windows 出现的缺陷曾经长期无人发现（两者都是本 job 的直接目标）：
    #   1. worker 心跳文件的默认值是 Unix 路径 /tmp/...，Windows 上解析为 \tmp\... 而崩溃，
    #      worker 根本起不来（tests/backend/test_worker_heartbeat.py 覆盖）；
    #   2. datasets/ 未钉 eol=lf，core.autocrlf=true 的检出改变演示资料字节，
    #      使其 sha256 与 manifest.json 记录不符，并级联影响修订 ID 与大量用例
    #      （tests/backend/test_k09.py 覆盖）。
    # 只跑后端单测：不需要 Neo4j，因此不依赖 Docker，运行时间与 ubuntu 的 backend job 相当。
    name: Backend (Windows portability)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
      # backend.sh 先找 .venv/bin/python（POSIX 布局），再回退 python3；Windows 上两者都不适用，
      # 因此必须显式给出解释器，它才会走 gate.py 的报告判定而不是静默退回。
      - name: Backend gate (Windows)
        env:
          PYTHON: python
        shell: bash
        run: scripts/verify/backend.sh full

  integration:
    name: Integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
          npm ci --no-audit --no-fund
          npm ci --prefix src/frontend --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Pull Neo4j image
        run: docker pull neo4j:5.26-community
      # K11 集成档：一次性 Neo4j 上的 tests/integration + F11 图库用例，再跑 K05/K06 端到端（演示模型，无付费调用）
      - name: Integration gate
        env:
          PYTHON: python
          E2E_PYTHON: python
        run: scripts/verify/integration.sh
      - name: Keep E2E evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .e2e/
          retention-days: 7
          if-no-files-found: ignore
