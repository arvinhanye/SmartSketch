name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked contract tools
        run: |
          python -m pip install 'pyyaml==6.0.2' 'openapi-spec-validator==0.9.0' 'jsonschema==4.26.0' 'datamodel-code-generator==0.26.3'
          python -m pip check
          npm install --prefix "$RUNNER_TEMP/contract-tools" --no-save --ignore-scripts --no-audit --no-fund 'openapi-typescript@7.4.4'
          echo "$RUNNER_TEMP/contract-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check verification script syntax
        run: bash -n scripts/verify.sh scripts/gen-contracts.sh scripts/verify/contracts.sh
      - name: Verify repository scaffold
        run: ./scripts/verify.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund
      - name: Type-check
        run: npm --prefix src/frontend run type-check
      - name: Test
        run: npm --prefix src/frontend run test -- --run
      - name: Build
        run: npm --prefix src/frontend run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
      - name: Test
        run: python -m pytest tests/backend -q
