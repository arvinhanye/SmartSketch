name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: launcher/go.mod
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked contract tools
        run: |
          python -m pip install 'pyyaml==6.0.2' 'openapi-spec-validator==0.9.0' 'jsonschema==4.26.0' 'datamodel-code-generator==0.26.3' 'pytest==8.3.5'
          python -m pip check
          npm install --prefix "$RUNNER_TEMP/contract-tools" --no-save --ignore-scripts --no-audit --no-fund 'openapi-typescript@7.4.4'
          echo "$RUNNER_TEMP/contract-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check verification script syntax
        run: bash -n scripts/verify.sh scripts/gen-contracts.sh scripts/verify/contracts.sh
      - name: Verify repository scaffold
        run: ./scripts/verify.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund
      # K11：类型检查、vitest 全量（JUnit 报告判定：零测试、失败、未登记 skip 都判红）、构建
      - name: Frontend gate
        run: scripts/verify/frontend.sh full

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: launcher/go.mod
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
      # K11：pytest tests/backend + tests/tooling，并判定报告（零测试、失败、未登记 SKIP 都判红）
      - name: Startup gate
        run: scripts/verify/startup.sh
      - name: Backend gate
        env:
          PYTHON: python
        run: scripts/verify/backend.sh full

  integration:
    name: Integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: launcher/go.mod
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install -e './src/backend[test]'
          python -m pip check
          npm ci --no-audit --no-fund
          npm ci --prefix src/frontend --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Pull Neo4j image
        run: docker pull neo4j:5.26-community
      # K11 集成档：一次性 Neo4j 上的 tests/integration + F11 图库用例，再跑 K05/K06 端到端（演示模型，无付费调用）
      - name: Integration gate
        env:
          PYTHON: python
          E2E_PYTHON: python
        run: scripts/verify/integration.sh
      - name: Keep E2E evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .e2e/
          retention-days: 7
          if-no-files-found: ignore
