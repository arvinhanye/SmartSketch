name: Startup platform source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        # Runner source checks are not double-click/Docker hardware acceptance.
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: launcher/go.mod
      - name: Unit and vet
        shell: bash
        run: scripts/verify/startup.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -e './src/backend[test]'
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Synthetic wizard browser checks
        env:
          PYTHONPATH: src/backend
        run: python -m pytest tests/startup/test_wizard_ui.py -q
